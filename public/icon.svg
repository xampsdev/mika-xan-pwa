<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Smooth 5-stop diagonal gradient across Rose Quartz & Serenity spectrum -->
    <linearGradient id="roseSerenityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7cac9" />
      <stop offset="25%" stop-color="#dec2cb" />
      <stop offset="50%" stop-color="#c5b9cd" />
      <stop offset="75%" stop-color="#abb1cf" />
      <stop offset="100%" stop-color="#92a8d1" />
    </linearGradient>

    <!-- Subtle depth filter for the card badge -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E293B" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Background with rounded squircle (maskable safe zone aligned) -->
  <rect width="512" height="512" rx="112" fill="url(#roseSerenityGrad)" />

  <!-- Soft inner card badge at 92% opacity -->
  <rect x="76" y="76" width="360" height="360" rx="84" fill="#FAF8F9" fill-opacity="0.92" stroke="#dec2cb" stroke-width="2" filter="url(#badgeShadow)" />

  <!-- Center Graphic: Clean modern pet paw print in high-contrast dark slate (#1E293B) -->
  <g>
    <!-- Main Pad -->
    <path d="M 256 324 C 218 324 192 294 204 260 C 213 237 236 226 256 226 C 276 226 299 237 308 260 C 320 294 294 324 256 324 Z" fill="#1E293B" />

    <!-- Subtle Heart Accent Cutout inside Main Pad -->
    <path d="M 256 292 C 256 292 243 281 237 274 C 231 266 235 256 244 256 C 249 256 253 259 256 262 C 259 259 263 256 268 256 C 277 256 281 266 275 274 C 269 281 256 292 256 292 Z" fill="#FAF8F9" />

    <!-- 4 Toe Pads with Natural Organic Arcs -->
    <ellipse cx="194" cy="212" rx="21" ry="31" transform="rotate(-22 194 212)" fill="#1E293B" />
    <ellipse cx="235" cy="178" rx="19" ry="33" transform="rotate(-7 235 178)" fill="#1E293B" />
    <ellipse cx="277" cy="178" rx="19" ry="33" transform="rotate(7 277 178)" fill="#1E293B" />
    <ellipse cx="318" cy="212" rx="21" ry="31" transform="rotate(22 318 212)" fill="#1E293B" />
  </g>

  <!-- Brand Typography: High-Contrast Dark Slate (#1E293B) & Slate Accent -->
  <text x="256" y="372" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#1E293B" text-anchor="middle" letter-spacing="4">MIKA &amp; XAN</text>
  <text x="256" y="394" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="2.5">PET BOARDING</text>
</svg>
